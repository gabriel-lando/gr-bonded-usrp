id: bonded_usrp_overlap_reconstructor
label: Overlap Reconstructor
category: '[bonded_usrp]'

templates:
  imports: |-
    from gnuradio import bonded_usrp
  make: |-
    bonded_usrp.overlap_reconstructor(${rate_in}, ${rate_out}, ${target_bw}, ${overlap_bw}, ${radio1_offset}, ${radio2_offset})

parameters:
  - id: rate_in
    label: Per-radio Rate (Hz)
    dtype: real
    default: 12.5e6
  - id: rate_out
    label: Combined Rate (Hz)
    dtype: real
    default: 20e6
  - id: target_bw
    label: Target Bandwidth (Hz)
    dtype: real
    default: 20e6
  - id: overlap_bw
    label: Overlap Bandwidth (Hz)
    dtype: real
    default: 5e6
  - id: radio1_offset
    label: Radio1 Offset (Hz)
    dtype: real
    default: -3.75e6
  - id: radio2_offset
    label: Radio2 Offset (Hz)
    dtype: real
    default: 3.75e6

inputs:
  - label: radio1
    domain: stream
    dtype: complex
  - label: radio2
    domain: stream
    dtype: complex

outputs:
  - label: out
    domain: stream
    dtype: complex

documentation: |-
  Overlap-aware wideband reconstruction (RX side).

  Two radios each capture one slice of a target channel, the two slices sharing
  an overlap of overlap_bw centred on fc. The block aligns radio 2 to radio 1
  (gain and phase) over the overlap, crossfades the slices and discards the
  out-of-band corners, producing the contiguous target channel at rate_out.

  Inputs are channel 0 of each bonded radio (ports 0 and 2 of the Bonded USRP
  Source). radio1_offset/radio2_offset are each radio's centre minus fc (Hz)
  and must match the frequencies the radios are tuned to.

  Edge-aligned plan (no captured-then-discarded corners): per-radio rate =
  (target_bw + overlap_bw) / 2, offsets = -/+ (target_bw - overlap_bw) / 4.
  The defaults are that plan for a 20 MHz channel with a 5 MHz overlap.

file_format: 1
