id: bonded_usrp_bonded_sink
label: Bonded USRP Sink
category: '[bonded_usrp]'

templates:
  imports: |-
    from gnuradio import bonded_usrp
  make: |-
    bonded_usrp.bonded_sink(${serials_csv}, ${rate}, ${freq}, ${gain}, ${clock_source}, ${time_source}, ${strict_lock}, ${lock_timeout}, ${subdev}, ${freq_plan_csv}, ${stream_args}, ${delay_trim_a}, ${delay_trim_b}, ${gain_plan_csv}, ${freq_offset_csv}, ${phase_offset_csv})

parameters:
  - id: serials_csv
    label: Serials CSV
    dtype: string
    default: 'SERIAL_A,SERIAL_B'
  - id: rate
    label: Per-radio Rate (Hz)
    dtype: real
    default: 10e6
  - id: freq
    label: Center Frequency (Hz)
    dtype: real
    default: 2.412e9
  - id: gain
    label: TX Gain (normalized 0-1)
    dtype: real
    default: 0.5
  - id: clock_source
    label: Clock Source
    dtype: string
    default: external
  - id: time_source
    label: Time Source
    dtype: string
    default: external
  - id: strict_lock
    label: Strict Lock
    dtype: bool
    default: 'False'
  - id: lock_timeout
    label: Lock Timeout (s)
    dtype: real
    default: 5.0
  - id: subdev
    label: Subdev Spec
    dtype: string
    default: ''
  - id: freq_plan_csv
    label: Freq Plan CSV
    dtype: string
    default: ''
  - id: stream_args
    label: Stream Args
    dtype: string
    default: ''
  - id: delay_trim_a
    label: Delay Trim A (samples)
    dtype: int
    default: 0
  - id: delay_trim_b
    label: Delay Trim B (samples)
    dtype: int
    default: 0
  - id: gain_plan_csv
    label: Gain Plan CSV
    dtype: string
    default: ''
  - id: freq_offset_csv
    label: Freq Offset CSV (Hz)
    dtype: string
    default: ''
  - id: phase_offset_csv
    label: Phase Offset CSV (rad)
    dtype: string
    default: ''

inputs:
  - label: radio_a
    domain: stream
    dtype: complex
  - label: radio_b
    domain: stream
    dtype: complex

documentation: |-
  Bonded USRP sink (TX side).

  Transmits two per-radio complex streams (at rate Hz each) through two B210s
  that share an external 10 MHz reference and PPS. Both radios are locked to
  the reference, their clocks are set to a common time on a PPS edge, and both
  start streaming at the same device time. The radios stream continuously for
  the whole session: gaps between input bursts are filled with zeros, so each
  burst starts at full power (a B210 needs several hundred microseconds to ramp
  up after idle). If either radio underruns, both restart on a common time.

  serials_csv: exactly two B210 serials, radio A (lower half) first.
  gain: normalized TX gain [0, 1]; gain_plan_csv overrides it per radio.
  freq_plan_csv: per-radio centre frequencies (Hz); empty tunes both to freq.
  delay_trim_a/b: per-radio delay in samples (positive delays that radio).
  freq_offset_csv / phase_offset_csv: per-radio digital frequency (Hz) and
    phase (rad) correction. The phase can also be changed while running with
    set_phase_offset(device, rad).

  The device setup (several seconds) runs when the block is constructed, so
  nothing upstream can queue a backlog before streaming starts.

  frames_sent() counts the bursts handed to the radios.

  Typical chain: baseband source -> Band Splitter -> Bonded USRP Sink.

file_format: 1
