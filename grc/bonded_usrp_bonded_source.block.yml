id: bonded_usrp_bonded_source
label: Bonded USRP Source
category: '[bonded_usrp]'

templates:
  imports: |-
    from gnuradio import bonded_usrp
  make: |-
    bonded_usrp.bonded_source(${serials_csv}, ${rate}, ${freq}, ${gain}, ${clock_source}, ${time_source}, ${strict_lock}, ${lock_timeout}, ${fetch_timeout}, ${subdev}, ${freq_plan_csv}, ${stream_args})

parameters:
  - id: serials_csv
    label: Serials CSV
    dtype: string
    default: 'SERIAL_A,SERIAL_B'
  - id: rate
    label: Per-radio Rate (Hz)
    dtype: real
    default: 10e6
  - id: freq
    label: Center Frequency (Hz)
    dtype: real
    default: 2.412e9
  - id: gain
    label: Gain (dB)
    dtype: real
    default: 40
  - id: clock_source
    label: Clock Source
    dtype: string
    default: external
  - id: time_source
    label: Time Source
    dtype: string
    default: external
  - id: strict_lock
    label: Strict Lock
    dtype: bool
    default: 'False'
  - id: lock_timeout
    label: Lock Timeout (s)
    dtype: real
    default: 5.0
  - id: fetch_timeout
    label: Fetch Timeout (s)
    dtype: real
    default: 1.0
  - id: subdev
    label: Subdev Spec
    dtype: string
    default: ''
  - id: freq_plan_csv
    label: Freq Plan CSV
    dtype: string
    default: ''
  - id: stream_args
    label: Stream Args
    dtype: string
    default: ''

outputs:
  - label: out0
    domain: stream
    dtype: complex
  - label: out1
    domain: stream
    dtype: complex
  - label: out2
    domain: stream
    dtype: complex
  - label: out3
    domain: stream
    dtype: complex

documentation: |-
  Bonded USRP source (RX side).

  Streams from two B210s that share an external 10 MHz reference and PPS.
  Both radios are locked to the reference, their clocks are set to a common
  time on a PPS edge, and samples are aligned by timestamp, so the outputs of
  the two radios are sample-aligned. A block in which either radio lost
  samples (overflow) is dropped on both radios, which keeps them aligned.

  Outputs: 2 ports per radio (out0/out1 = radio A ch0/ch1, out2/out3 = radio
  B ch0/ch1). Use out0 and out2 for the Overlap Reconstructor.

  serials_csv: two B210 serials, radio A (lower slice) first.
  freq_plan_csv: per-radio centre frequencies (Hz); empty tunes both to freq.
  stream_args: extra UHD RX stream args (e.g. num_recv_frames=...).

file_format: 1
